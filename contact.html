<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Vijay Kowshik</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">

    <style>
        /* --- CORE STYLES --- */
        :root {
            /* Expensive, slow easing for the zoom */
            --ease-warp: cubic-bezier(0.7, 0, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            perspective: 1000px;
            /* Adds 3D depth */
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
        }

        ul {
            list-style: none;
        }

        /* --- CUSTOM CURSOR --- */
        .cursor {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease, width 0.3s, height 0.3s;
            mix-blend-mode: difference;
        }

        .cursor.hovered {
            background-color: rgba(255, 255, 255, 0.2);
            width: 60px;
            height: 60px;
            border-color: #fff;
        }

        /* --- PRELOADER --- */
        .preloader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);

            /* Background Animation */
            background: radial-gradient(circle, #151515 0%, #000000 70%);
            background-size: 150% 150%;
            animation: loaderPulse 4s ease-in-out infinite;
        }

        @keyframes loaderPulse {
            0% {
                background-position: 50% 50%;
                opacity: 1;
            }

            50% {
                background-position: 50% 40%;
                opacity: 0.95;
            }

            100% {
                background-position: 50% 50%;
                opacity: 1;
            }
        }

        body.loaded .preloader {
            transform: translateY(-100%);
        }

        .loader-circle {
            width: 300px;
            height: 300px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Rotating Ring Effect */
        .loader-circle::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: rgba(255, 255, 255, 0.3);
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 1.5rem;
            /* Standard Size */
            color: #fff;
        }

        .loader-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
            color: #666;
        }

        .loader-counter {
            font-family: 'Montserrat', sans-serif;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #888;
        }


        /* --- NAV --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 500;
            mix-blend-mode: difference;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo span {
            display: block;
            font-size: 0.6rem;
            opacity: 0.6;
            margin-top: 5px;
        }

        .menu-btn {
            width: 40px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 500;
        }

        .menu-btn .line {
            width: 100%;
            height: 1px;
            background: #fff;
            transition: all 0.4s ease;
        }

        /* --- MENU OVERLAY --- */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #080808;
            z-index: 400;
            transform: translateX(100%);
            transition: transform 0.8s var(--ease-warp);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 10%;
        }

        .menu-overlay.active {
            transform: translateX(0);
        }

        .menu-links a {
            font-family: 'Montserrat', sans-serif;
            font-size: 3rem;
            font-weight: 100;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 5px;
            display: inline-block;
            margin: 10px 0;
            transition: 0.3s;
        }

        .menu-links a:hover {
            color: #fff;
            padding-left: 20px;
        }

        .menu-btn.active .line:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .menu-btn.active .line:nth-child(2) {
            opacity: 0;
        }

        .menu-btn.active .line:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -6px);
        }

        /* --- THE SPACE CONTAINER --- */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* The Stars Layer */
        .star-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transition: transform 2.5s var(--ease-warp), opacity 1s ease 1s;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.8;
        }

        /* --- THE EARTH DOT (Clickable Target) --- */
        .earth-wrapper {
            position: absolute;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: none;
            transition: transform 2.5s var(--ease-warp), opacity 0.5s ease;
        }

        /* The white dot itself */
        .earth-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        /* The pulsating ring */
        .earth-dot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: ripple 2s infinite;
        }

        .earth-label {
            margin-top: 20px;
            text-align: center;
            opacity: 0.8;
            transition: 0.3s;
        }

        .arrow-pointer {
            font-size: 1.5rem;
            margin-bottom: 5px;
            display: block;
            animation: bounce 1.5s infinite;
        }

        .label-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @keyframes ripple {
            0% {
                width: 100%;
                height: 100%;
                opacity: 1;
                border-width: 1px;
            }

            100% {
                width: 500%;
                height: 500%;
                opacity: 0;
                border-width: 0px;
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* --- ZOOM STATE (THE ANIMATION) --- */
        /* When active, the starfield expands massively */
        .scene.active .star-field {
            transform: scale(20) rotate(10deg);
            opacity: 0;
            /* Fade out stars as we get "too close" */
        }

        /* The Earth Dot scales up to cover screen */
        .scene.active .earth-wrapper {
            transform: scale(50);
            /* Scale up dot */
            opacity: 0;
            /* Fade out dot right at the end */
        }

        /* --- THE REVEAL (Contact Info) --- */
        .contact-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            /* New background after landing */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease 1.5s;
            /* Wait for zoom to finish */
            z-index: 100;
        }

        .contact-content.visible {
            opacity: 1;
            pointer-events: all;
        }

        .contact-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .contact-subtitle {
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 50px;
        }

        .contact-email {
            font-size: 1.5rem;
            font-weight: 200;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            transition: 0.3s;
            color: #fff;
        }

        .contact-email:hover {
            border-color: #fff;
        }

        .social-links {
            margin-top: 60px;
            display: flex;
            gap: 40px;
        }

        .social-links a {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.5;
        }

        .social-links a:hover {
            opacity: 1;
        }

        .back-btn {
            position: absolute;
            bottom: 50px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.4;
            cursor: pointer;
        }

        .back-btn:hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="cursor"></div>

    <div class="preloader">
        <div class="loader-circle">
            <div class="loader-title">Vijay Kowshik</div>
            <div class="loader-subtitle">Contact</div>
            <div class="loader-counter">0 / 100</div>
        </div>
    </div>

    <nav>
        <div class="logo">
            <a href="index.html">Vijay Kowshik</a>
            <span>Filmmaker/ Editor/ Cinematographer</span>
        </div>
        <div class="menu-btn" data-cursor="hover"><span class="line"></span><span class="line"></span><span
                class="line"></span></div>
    </nav>

    <div class="menu-overlay">
        <ul class="menu-links">
            <li><a href="photographs.html" data-cursor="hover">Photographs</a></li>
            <li><a href="films.html" data-cursor="hover">Films</a></li>
            <li><a href="resume.html" data-cursor="hover">Resume</a></li>
            <li><a href="about.html" data-cursor="hover">About</a></li>
            <li><a href="contact.html" data-cursor="hover">Contact</a></li>
        </ul>
    </div>

    <!-- THE SCENE (Universe + Earth) -->
    <div class="scene" id="scene">

        <div class="star-field" id="starField">
            <!-- Stars generated via JS -->
        </div>

        <!-- CLICKABLE EARTH -->
        <div class="earth-wrapper" id="earthTrigger" data-cursor="hover">
            <div class="earth-dot"></div>
            <div class="earth-label">
                <span class="arrow-pointer">↓</span>
                <div class="label-text">EARTH<br>( Click to Land )</div>
            </div>
        </div>

    </div>

    <!-- CONTENT REVEALED AFTER ZOOM -->
    <div class="contact-content" id="contactContent">
        <div class="contact-subtitle">Location: Earth</div>
        <h1 class="contact-title">Let's Collaborate</h1>

        <a href="mailto:vijaykowshik3@gmail..com" class="contact-email" data-cursor="hover">vijaykowshik3@gmail.com</a>

        <div class="social-links">
            <a href="#" data-cursor="hover">Instagram</a>
            <a href="#" data-cursor="hover">LinkedIn</a>
            <a href="#" data-cursor="hover">Vimeo</a>
        </div>

        <div class="back-btn" id="resetUniverse" data-cursor="hover">[ Return to Orbit ]</div>
    </div>

    <script>
        // --- 1. PRELOADER (Runs Immediately) ---
        const counterElement = document.querySelector('.loader-counter');
        let count = 0;

        function startLoader() {
            let interval = setInterval(() => {
                count++;
                counterElement.innerText = `${count} / 100`;

                if (count >= 100) {
                    clearInterval(interval);
                    // Force the loader to finish
                    document.body.classList.add('loaded');
                }
            }, 10);
        }

        // Execute immediately, do not wait for assets
        startLoader();

        // --- 2. STAR GENERATOR ---
        const starField = document.getElementById('starField');
        const starCount = 200;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');

            const r = Math.random() * 80 + 10;
            const angle = Math.random() * 360;
            const x = 50 + r * Math.cos(angle * Math.PI / 180);
            const y = 50 + r * Math.sin(angle * Math.PI / 180);
            const size = Math.random() * 2;
            const opacity = Math.random();

            star.style.left = `${x}%`;
            star.style.top = `${y}%`;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.opacity = opacity;

            starField.appendChild(star);
        }

        // --- 3. ZOOM ANIMATION ---
        const scene = document.getElementById('scene');
        const earthTrigger = document.getElementById('earthTrigger');
        const contactContent = document.getElementById('contactContent');
        const resetBtn = document.getElementById('resetUniverse');

        // CLICK: Zoom In
        earthTrigger.addEventListener('click', () => {
            scene.classList.add('active'); // Triggers CSS Transform
            contactContent.classList.add('visible'); // Fades in text
        });

        // RESET: Zoom Out
        resetBtn.addEventListener('click', () => {
            scene.classList.remove('active');
            contactContent.classList.remove('visible');
        });

        // --- 4. UI LOGIC ---
        const menuBtn = document.querySelector('.menu-btn');
        const menuOverlay = document.querySelector('.menu-overlay');
        const menuLinks = document.querySelectorAll('.menu-links a');

        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        });

        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                menuBtn.classList.remove('active');
                menuOverlay.classList.remove('active');
            });
        });

        const cursor = document.querySelector('.cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('[data-cursor="hover"]').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
        });
    </script>
</body>

</html>
