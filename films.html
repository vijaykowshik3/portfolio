<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Films | Vijay Kowshik</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

body {
    background: #050505;
    color: #e0e0e0;
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
}

a { text-decoration: none; color: inherit; }

/* CURSOR */
.cursor {
    width: 40px; height: 40px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: 0.15s;
    mix-blend-mode: difference;
}
.cursor.hovered {
    width: 60px; height: 60px;
    background: rgba(255,255,255,0.2);
}

/* PRELOADER */
.preloader {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10000;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 1.2s cubic-bezier(0.77,0,0.175,1);
}
body.loaded .preloader { transform: translateY(-100%); }

.loader-circle {
    width: 300px;
    height: 300px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
.loader-title {
    font-weight: 200;
    letter-spacing: 3px;
    text-transform: uppercase;
}
.loader-counter {
    margin-top: 15px;
    font-size: 0.8rem;
    color: #888;
}

/* NAV */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 30px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    mix-blend-mode: difference;
}
.logo { letter-spacing: 2px; text-transform: uppercase; font-size: 1rem; }
.logo span { display: block; font-size: 0.6rem; opacity: 0.6; margin-top: 4px; }

.menu-btn {
    width: 35px;
    height: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}
.menu-btn .line {
    height: 1px;
    background: #fff;
    transition: 0.4s;
}
.menu-btn.active .line:nth-child(1) { transform: rotate(45deg) translate(8px,8px); }
.menu-btn.active .line:nth-child(2) { opacity: 0; }
.menu-btn.active .line:nth-child(3) { transform: rotate(-45deg) translate(8px,-8px); }

/* MENU */
.menu-overlay {
    position: fixed;
    inset: 0;
    background: #080808;
    transform: translateX(100%);
    transition: transform 0.6s cubic-bezier(0.77,0,0.175,1);
    z-index: 150;
    display: flex;
    align-items: center;
    padding-left: 10%;
}
.menu-overlay.active { transform: translateX(0); }
.menu-links a {
    display: block;
    font-size: 3rem;
    font-weight: 200;
    letter-spacing: 5px;
    color: #444;
    margin: 12px 0;
}
.menu-links a:hover { color: #fff; padding-left: 20px; }

/* FILMS */
.films-container {
    padding: 150px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 150px;
}

.film-item {
    width: 90%;
    max-width: 1000px;
    text-align: center;
    opacity: 0;
    transform: translateY(50px);
    transition: 0.8s ease;
}
.film-item.visible { opacity: 1; transform: translateY(0); }

.film-title {
    font-size: 0.9rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
}
.film-title::after {
    content: '';
    display: block;
    width: 30px;
    height: 1px;
    background: #fff;
    margin: 10px auto 0;
}

.video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    overflow: hidden;
    cursor: pointer;
}
.video-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%) brightness(0.8);
    transition: 0.6s;
}
.video-wrapper:hover img {
    filter: grayscale(0%) brightness(1);
    transform: scale(1.03);
}
.play-button {
    position: absolute;
    inset: 50%;
    width: 60px;
    height: 60px;
    transform: translate(-50%,-50%);
    border: 1px solid #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.play-button::before {
    content: "▶";
    margin-left: 4px;
}

/* MODAL */
.video-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.4s;
    z-index: 20000;
}
.video-modal.active {
    opacity: 1;
    pointer-events: all;
}
.modal-content {
    width: 80%;
    max-width: 1200px;
    aspect-ratio: 16/9;
    position: relative;
}
.close-modal {
    position: absolute;
    top: -50px;
    right: 0;
    letter-spacing: 2px;
    cursor: pointer;
}
iframe { width: 100%; height: 100%; border: none; }

@media(max-width:768px){
    .cursor{display:none;}
    .menu-links a{font-size:2rem;}
    .modal-content{width:95%;}
}
</style>
</head>

<body>

<div class="cursor"></div>

<div class="preloader">
    <div class="loader-circle">
        <div class="loader-title">Vijay Kowshik</div>
        <div class="loader-title" style="font-size:0.7rem;margin-top:6px;">Films</div>
        <div class="loader-counter">0 / 100</div>
    </div>
</div>

<nav>
    <div class="logo">
        <a href="index.html">Vijay Kowshik</a>
        <span>Filmmaker</span>
    </div>
    <div class="menu-btn" data-cursor="hover">
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
    </div>
</nav>

<div class="menu-overlay">
    <div class="menu-links">
        <a href="photographs.html">Photographs</a>
        <a href="films.html">Films</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>
</div>

<main class="films-container">

<div class="film-item" data-cursor="hover">
    <div class="film-title">Film One</div>
    <div class="video-wrapper" data-youtube-id="Af30_dzcsfM">
        <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1600">
        <div class="play-button"></div>
    </div>
</div>

<div class="film-item" data-cursor="hover">
    <div class="film-title">Film Two</div>
    <div class="video-wrapper" data-youtube-id="DYXCu04G_zo">
        <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1600">
        <div class="play-button"></div>
    </div>
</div>

<div class="film-item" data-cursor="hover">
    <div class="film-title">Film Three</div>
    <div class="video-wrapper" data-youtube-id="CQ1N7_YZ5oA">
        <img src="https://images.unsplash.com/photo-1518134558225-c546059d453b?q=80&w=1600">
        <div class="play-button"></div>
    </div>
</div>

</main>

<div class="video-modal" id="videoModal">
    <div class="modal-content">
        <div class="close-modal">Close [x]</div>
        <iframe id="youtube-frame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
</div>

<script>
// PRELOADER
let count = 0;
const counter = document.querySelector('.loader-counter');
const interval = setInterval(()=>{
    count++;
    counter.textContent = `${count} / 100`;
    if(count >= 100){
        clearInterval(interval);
        document.body.classList.add('loaded');
    }
},15);

// SCROLL
const observer = new IntersectionObserver(entries=>{
    entries.forEach(e=>e.isIntersecting && e.target.classList.add('visible'));
},{threshold:0.1});
document.querySelectorAll('.film-item').forEach(el=>observer.observe(el));

// MENU
const menuBtn = document.querySelector('.menu-btn');
const menu = document.querySelector('.menu-overlay');
menuBtn.onclick = ()=>{ menuBtn.classList.toggle('active'); menu.classList.toggle('active'); };

// MODAL VIDEO
const wrappers = document.querySelectorAll('.video-wrapper');
const modal = document.getElementById('videoModal');
const iframe = document.getElementById('youtube-frame');
const closeBtn = document.querySelector('.close-modal');

wrappers.forEach(w=>{
    w.onclick = ()=>{
        const id = w.dataset.youtubeId;
        iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;
        modal.classList.add('active');
    };
});
function closeVideo(){
    modal.classList.remove('active');
    setTimeout(()=>iframe.src='',300);
}
closeBtn.onclick = closeVideo;
modal.onclick = e=> e.target===modal && closeVideo();

// CURSOR
const cursor = document.querySelector('.cursor');
document.addEventListener('mousemove',e=>{
    cursor.style.left=e.clientX+'px';
    cursor.style.top=e.clientY+'px';
});
document.querySelectorAll('[data-cursor="hover"]').forEach(el=>{
    el.onmouseenter=()=>cursor.classList.add('hovered');
    el.onmouseleave=()=>cursor.classList.remove('hovered');
});
</script>

</body>
</html>
